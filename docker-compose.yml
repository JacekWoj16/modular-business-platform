services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "15433:5432"
    environment:
      POSTGRES_DB: modular_app
      POSTGRES_USER: modular_app
      POSTGRES_PASSWORD: modular_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modular_app -d modular_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
